<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dental Lead Response System — Demo</title>
<style>
  :root{
    --bg:#0b1020; --card:#141b30; --card2:#1b2440; --line:#26304f;
    --txt:#e7ecf7; --mut:#8b96b5; --acc:#7aa2ff;
    --hot:#fb7185; --warm:#fbbf24; --cold:#60a5fa; --ok:#34d399; --warn:#fcd34d;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--txt);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:24px}
  header{display:flex;align-items:center;gap:12px;padding-bottom:16px;
         border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
  .logo{width:40px;height:40px;border-radius:11px;color:#fff;font-size:20px;
        background:linear-gradient(135deg,#4f46e5,#6366f1);
        display:flex;align-items:center;justify-content:center}
  h1{font-size:19px}
  .tag{color:var(--mut);font-size:13px}
  .stats{margin-left:auto;text-align:right;font-size:13px;color:var(--mut)}
  .stats b{color:var(--txt);font-size:16px}
  .banner{background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.5);
          color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px;
          font-weight:600;margin-bottom:18px;text-align:center}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:20px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:10px}
  h2 small{text-transform:none;letter-spacing:0}
  .lead{cursor:pointer;margin-bottom:10px;display:flex;justify-content:space-between;
        align-items:center;gap:10px;transition:.15s}
  .lead:hover{border-color:var(--acc)}
  .lead.sel{border-color:var(--acc);background:var(--card2)}
  .lead b{display:block;font-size:14px}
  .lead small{color:var(--mut)}
  .chip{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
  .score-ring{width:96px;height:96px;border-radius:50%;flex:none;
              display:flex;align-items:center;justify-content:center}
  .score-ring>div{width:74px;height:74px;border-radius:50%;background:var(--card);
                  display:flex;flex-direction:column;align-items:center;justify-content:center}
  .score-ring b{font-size:24px;line-height:1}
  .score-ring small{font-size:10px;color:var(--mut)}
  .reasons{list-style:none;margin:8px 0}
  .reasons li{padding:5px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .r-plus{color:var(--ok)} .r-minus{color:var(--hot)} .r-neut{color:var(--mut)}
  /* timeline */
  .tl{list-style:none;margin:6px 0 2px}
  .tl li{position:relative;padding:0 0 13px 26px;font-size:13px}
  .tl li:before{content:"";position:absolute;left:6px;top:5px;width:9px;height:9px;
                border-radius:50%;background:var(--acc)}
  .tl li:after{content:"";position:absolute;left:10px;top:17px;bottom:-1px;
               width:1px;background:var(--line)}
  .tl li:last-child:after{display:none}
  .tl li.pending{opacity:.38}
  .tl li.pending:before{background:var(--line)}
